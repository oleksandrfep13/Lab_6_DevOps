version: '3.8'

services:
  app:
    build: .
    container_name: flask_app
    ports:
      - "8080:8080"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_lab
      POSTGRES_HOST: db

    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: postgres_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_lab

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: